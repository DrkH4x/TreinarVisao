<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA de Reconhecimento - Demonstração</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; text-align: center; margin: 0; padding: 15px; }
    h1 { color: #00e5ff; font-size: 1.4rem; margin-bottom: 5px; }
    .instrucao { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; }
    
    #video-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
    video { width: 100%; border-radius: 10px; border: 3px solid #00e5ff; transform: scaleX(-1); transition: border-color 0.3s; }
    video.sucesso { border-color: #2ecc71; }
    video.confuso { border-color: #e74c3c; }

    /* Barras de Probabilidade */
    #painel-probabilidades { margin-top: 15px; background: #16213e; padding: 10px; border-radius: 8px; text-align: left; }
    .barra-container { margin-bottom: 8px; }
    .barra-label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 2px; }
    .barra-fundo { width: 100%; height: 12px; background: #0f3460; border-radius: 6px; overflow: hidden; }
    .barra-preenchimento { height: 100%; width: 0%; background: #00e5ff; transition: width 0.2s, background 0.2s; }
    .barra-preenchimento.vencedor { background: #2ecc71; }

    .classe { background: #16213e; padding: 10px; margin: 5px 0; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
    .classe input { width: 100px; padding: 5px; border-radius: 4px; border: none; }
    .classe button { background: #00e5ff; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    
    .btn-treinar { background: #2ecc71; color: #fff; border: none; padding: 15px 25px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn-treinar:disabled { background: #555; cursor: not-allowed; }
    
    #status { margin-top: 10px; font-size: 0.9rem; color: #f1c40f; font-weight: bold; }
  </style>
</head>
<body>

  <h1>📸 Demonstração de IA</h1>
  <p class="instrucao">Capture fotos de 2 objetos diferentes. Depois, teste um de cada vez!</p>
  
  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <!-- Painel de Probabilidades -->
  <div id="painel-probabilidades" style="display: none;">
    <div class="barra-container">
      <div class="barra-label"><span id="label1">Objeto A</span> <span id="porc1">0%</span></div>
      <div class="barra-fundo"><div class="barra-preenchimento" id="barra1"></div></div>
    </div>
    <div class="barra-container">
      <div class="barra-label"><span id="label2">Objeto B</span> <span id="porc2">0%</span></div>
      <div class="barra-fundo"><div class="barra-preenchimento" id="barra2"></div></div>
    </div>
    <div class="barra-container">
      <div class="barra-label"><span id="label3">Fundo / Nada</span> <span id="porc3">0%</span></div>
      <div class="barra-fundo"><div class="barra-preenchimento" id="barra3"></div></div>
    </div>
  </div>

  <div class="controles">
    <div class="classe">
      <input type="text" id="nomeClasse1" value="Objeto A" placeholder="Classe 1">
      <button id="btnCaptura1">Capturar</button>
      <span id="contador1">0 fotos</span>
    </div>
    <div class="classe">
      <input type="text" id="nomeClasse2" value="Objeto B" placeholder="Classe 2">
      <button id="btnCaptura2">Capturar</button>
      <span id="contador2">0 fotos</span>
    </div>
    <div class="classe">
      <input type="text" id="nomeClasse3" value="Fundo" placeholder="Classe 3">
      <button id="btnCaptura3">Capturar</button>
      <span id="contador3">0 fotos</span>
    </div>

    <button class="btn-treinar" id="btnTreinar" disabled>Treinar Modelo</button>
    <div id="status">Carregando modelo base...</div>
  </div>

  <!-- Importando TensorFlow.js e MobileNet -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0"></script>

  <script>
    const video = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const btnTreinar = document.getElementById('btnTreinar');
    const painelProbabilidades = document.getElementById('painel-probabilidades');

    let mobilenetModel;
    let classificador;
    let webcamAtiva = false;

    const dadosTreino = { classe1: [], classe2: [], classe3: [] };
    const contadores = { classe1: 0, classe2: 0, classe3: 0 };

    // Iniciar Webcam
    async function setupWebcam() {
      return new Promise((resolve, reject) => {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(stream => {
            video.srcObject = stream;
            video.addEventListener('loadeddata', () => { webcamAtiva = true; resolve(); });
          })
          .catch(err => reject(err));
      });
    }

    // Carregar MobileNet
    async function carregarModeloBase() {
      statusEl.textContent = "Carregando MobileNet...";
      mobilenetModel = await mobilenet.load();
      
      classificador = tf.sequential();
      classificador.add(tf.layers.dense({ inputShape: [1024], units: 100, activation: 'relu' }));
      classificador.add(tf.layers.dense({ units: 3, activation: 'softmax' }));
      
      classificador.compile({
        optimizer: tf.train.adam(0.0001),
        loss: 'categoricalCrossentropy',
        metrics: ['accuracy']
      });

      statusEl.textContent = "Pronto! Capture fotos dos seus objetos.";
    }

    async function obterFeatures() {
      if (!mobilenetModel) return null;
      return mobilenetModel.infer(video, true);
    }

    // Capturar Fotos
    async function capturar(classeKey, contadorId) {
      if (!webcamAtiva || !mobilenetModel) return;

      const features = await obterFeatures();
      dadosTreino[classeKey].push(features);
      contadores[classeKey]++;
      document.getElementById(contadorId).textContent = `${contadores[classeKey]} fotos`;

      if (contadores.classe1 >= 10 && contadores.classe2 >= 10 && contadores.classe3 >= 10) {
        btnTreinar.disabled = false;
      }
    }

    document.getElementById('btnCaptura1').onclick = () => capturar('classe1', 'contador1');
    document.getElementById('btnCaptura2').onclick = () => capturar('classe2', 'contador2');
    document.getElementById('btnCaptura3').onclick = () => capturar('classe3', 'contador3');

    // Treinar
    btnTreinar.onclick = async () => {
      statusEl.textContent = "Treinando a rede neural...";
      btnTreinar.disabled = true;

      const todasFeatures = [];
      const todosLabels = [];

      dadosTreino.classe1.forEach(f => { todasFeatures.push(f); todosLabels.push([1, 0, 0]); });
      dadosTreino.classe2.forEach(f => { todasFeatures.push(f); todosLabels.push([0, 1, 0]); });
      dadosTreino.classe3.forEach(f => { todasFeatures.push(f); todosLabels.push([0, 0, 1]); });

      if (todasFeatures.length === 0) return;

      const xs = tf.stack(todasFeatures);
      const xsNormalizado = xs.div(tf.max(xs)); 
      const ys = tf.tensor2d(todosLabels);

      await classificador.fit(xsNormalizado, ys, {
        epochs: 30,
        shuffle: true,
        callbacks: {
          onEpochEnd: (epoch, logs) => {
            statusEl.textContent = `Treinando... Época ${epoch+1}/30`;
          }
        }
      });

      statusEl.textContent = "✅ Modelo Treinado! Faça o teste.";
      btnTreinar.style.display = 'none'; // Esconde o botão de treinar
      painelProbabilidades.style.display = 'block';
      
      // Atualiza os nomes no painel
      document.getElementById('label1').textContent = document.getElementById('nomeClasse1').value || "Objeto A";
      document.getElementById('label2').textContent = document.getElementById('nomeClasse2').value || "Objeto B";
      document.getElementById('label3').textContent = document.getElementById('nomeClasse3').value || "Fundo";

      iniciarPredicao();
    };

    // Loop de Predição com Demonstração Visual
    async function iniciarPredicao() {
      let contadorFrames = 0;
      let previsaoEstavel = 0; // Para evitar piscar muito rápido

      async function loop() {
        if (!webcamAtiva || !mobilenetModel) {
          requestAnimationFrame(loop);
          return;
        }

        const features = await obterFeatures();
        const normalizado = features.div(tf.max(features));
        const predicao = classificador.predict(normalizado);
        const dados = await predicao.data();

        // Atualiza as barras visuais
        for (let i = 0; i < 3; i++) {
          const prob = (dados[i] * 100).toFixed(1);
          const barra = document.getElementById(`barra${i+1}`);
          const porcentagem = document.getElementById(`porc${i+1}`);
          
          barra.style.width = `${prob}%`;
          porcentagem.textContent = `${prob}%`;

          // Se for a maior probabilidade, colore de verde
          if (dados[i] > 0.6) {
            barra.classList.add('vencedor');
          } else {
            barra.classList.remove('vencedor');
          }
        }

        // Feedback visual no vídeo (Demonstração)
        const maxProb = Math.max(...dados);
        if (maxProb > 0.8) {
          video.className = 'sucesso'; // Borda verde (tem certeza)
        } else if (maxProb < 0.5) {
          video.className = 'confuso'; // Borda vermelha (está confuso)
        } else {
          video.className = '';
        }

        features.dispose();
        normalizado.dispose();
        predicao.dispose();

        requestAnimationFrame(loop);
      }
      loop();
    }

    // Inicialização
    (async () => {
      try {
        await setupWebcam();
        await carregarModeloBase();
      } catch (e) {
        statusEl.textContent = "Erro: " + e.message;
      }
    })();
  </script>
</body>
</html>
